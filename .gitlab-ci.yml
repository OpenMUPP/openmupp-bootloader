stages:
  - build

image: "docker.vandertogt.org/firmware-builder:v1.14.0"

variables:
  GCC_TOOLCHAIN_PREFIX: /opt/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi

# Build on:
# - Tags
# - Merge requests
# - Branches
workflow:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

# The linker script limits the bootloader to 10 KB, so an image that
# does not fit fails the link.
build:
  stage: build
  parallel:
    matrix:
      - BOARD: [mini, otheruse]
  script:
    - cd "$CI_PROJECT_DIR"
    - make -j`nproc` BOARD=${BOARD} CROSS_COMPILE=${GCC_TOOLCHAIN_PREFIX}/bin/arm-none-eabi-
  artifacts:
    paths:
      - build/${BOARD}/*.elf
      - build/${BOARD}/*.hex
      - build/${BOARD}/*.bin
      - build/${BOARD}/*.map
    expire_in: 1 month
