stages:
  - build
  - test

image: "docker.vandertogt.org/firmware-builder:v1.14.0"

variables:
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  # system-stm32 gets its version from "git describe" and needs the tags.
  # A full clone each time: a fetch reuses an old shallow submodule clone.
  GIT_DEPTH: 0
  GIT_STRATEGY: clone
  GCC_TOOLCHAIN_PREFIX: /opt/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi

# Build on:
# - Tags
# - Merge requests
# - Branches
workflow:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

lint-code:
  stage: .pre
  script:
    - clang-format --version
    - cmake --version
    - cd "$CI_PROJECT_DIR"
    - BUILDDIR=clangformat-build
    - cmake -S . -B "${BUILDDIR}" -G "Unix Makefiles"
    - cmake --build ${BUILDDIR} --target clangformat
    - git diff --numstat
    - linter_errors=$(git diff --numstat | wc -l)
    - if [ ! "$linter_errors" -eq "0" ]; then echo "Detected formatting issues; please fix"; git diff; exit 1; else echo "Formatting is correct"; exit 0; fi
  after_script:
    - echo "Cleanup changes made"
    - git checkout .

# The new bootloader (CMake). The build fails when an image is larger than
# the bootloader area (8 KB): the linker script and a size check after the
# link both enforce the limit.
build:
  stage: build
  parallel:
    matrix:
      - BOARD: [mini, otheruse, stlinkv2]
  script:
    - cd "$CI_PROJECT_DIR"
    - cmake --preset ${BOARD} -DGCC_TOOLCHAIN_PREFIX=${GCC_TOOLCHAIN_PREFIX} -DVSL_WERROR=ON
    - cmake --build --preset ${BOARD} -j`nproc`
  artifacts:
    paths:
      - build/${BOARD}/*.elf
      - build/${BOARD}/*.hex
      - build/${BOARD}/*.bin
      - build/${BOARD}/*.map
    expire_in: 1 month

# Host unit tests (doctest), with the host compiler.
test-host:
  stage: test
  needs: []
  script:
    - cd "$CI_PROJECT_DIR"
    - cmake --preset host-tests -DVSL_WERROR=ON
    - cmake --build --preset host-tests -j`nproc`
    - ctest --preset host-tests

# Tests of the image stamp tool (tools/vsl-stamp-image.py) and of
# cmake/VslStampImage.cmake.
test-tools:
  stage: test
  needs: []
  script:
    - cd "$CI_PROJECT_DIR"
    - export PATH="${GCC_TOOLCHAIN_PREFIX}/bin:$PATH"
    - python3 -m unittest discover -v -s tools/tests
