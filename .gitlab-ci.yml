stages:
  - build
  - test

image: "docker.vandertogt.org/firmware-builder:v1.14.0"

variables:
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  # system-stm32 gets its version from "git describe" and needs the tags.
  GIT_DEPTH: 0
  GCC_TOOLCHAIN_PREFIX: /opt/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi

# Build on:
# - Tags
# - Merge requests
# - Branches
workflow:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

# The new bootloader (CMake). The build fails when an image is larger than
# the bootloader area (8 KB): the linker script and a size check after the
# link both enforce the limit.
build:
  stage: build
  parallel:
    matrix:
      - BOARD: [mini, otheruse]
  script:
    - cd "$CI_PROJECT_DIR"
    - cmake --preset ${BOARD} -DARM_GNU_TOOLCHAIN=${GCC_TOOLCHAIN_PREFIX} -DVSL_WERROR=ON
    - cmake --build --preset ${BOARD} -j`nproc`
  artifacts:
    paths:
      - build/${BOARD}/*.elf
      - build/${BOARD}/*.hex
      - build/${BOARD}/*.bin
      - build/${BOARD}/*.map
    expire_in: 1 month

# The old bootloader (Makefile, 10 KB area). It stays until #10 removes the
# old sources.
build-legacy:
  stage: build
  needs: []
  parallel:
    matrix:
      - BOARD: [mini, otheruse]
  script:
    - cd "$CI_PROJECT_DIR"
    - make -j`nproc` BOARD=${BOARD} BUILD_ROOT=build-legacy CROSS_COMPILE=${GCC_TOOLCHAIN_PREFIX}/bin/arm-none-eabi-
  artifacts:
    paths:
      - build-legacy/${BOARD}/*.elf
      - build-legacy/${BOARD}/*.hex
      - build-legacy/${BOARD}/*.bin
      - build-legacy/${BOARD}/*.map
    expire_in: 1 month

# Host unit tests (doctest), with the host compiler.
test-host:
  stage: test
  needs: []
  script:
    - cd "$CI_PROJECT_DIR"
    - cmake --preset host-tests -DVSL_WERROR=ON
    - cmake --build --preset host-tests -j`nproc`
    - ctest --preset host-tests

# Tests of the image stamp tool (tools/vsl-stamp-image.py) and of
# cmake/VslStampImage.cmake.
test-tools:
  stage: test
  needs: []
  script:
    - cd "$CI_PROJECT_DIR"
    - export PATH="${GCC_TOOLCHAIN_PREFIX}/bin:$PATH"
    - python3 -m unittest discover -v -s tools/tests
