stages:
  - build
  - test

image: "docker.vandertogt.org/firmware-builder:v1.14.0"

variables:
  GCC_TOOLCHAIN_PREFIX: /opt/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi

# Build on:
# - Tags
# - Merge requests
# - Branches
workflow:
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

# The build fails when an image is larger than the bootloader area (10 KB).
# The linker script and a size check after the link both enforce the limit.
build:
  stage: build
  parallel:
    matrix:
      - BOARD: [mini, otheruse]
  script:
    - cd "$CI_PROJECT_DIR"
    - cmake --preset ${BOARD} -DARM_GNU_TOOLCHAIN=${GCC_TOOLCHAIN_PREFIX}
    - cmake --build --preset ${BOARD} -j`nproc`
    # The Makefile build is the reference: the images must be the same.
    - make -j`nproc` BOARD=${BOARD} BUILD_ROOT=build-make CROSS_COMPILE=${GCC_TOOLCHAIN_PREFIX}/bin/arm-none-eabi-
    - cmp build/${BOARD}/versaloon-bootloader-${BOARD}.bin build-make/${BOARD}/versaloon-bootloader-${BOARD}.bin
    - cmp build/${BOARD}/versaloon-bootloader-${BOARD}.hex build-make/${BOARD}/versaloon-bootloader-${BOARD}.hex
  artifacts:
    paths:
      - build/${BOARD}/*.elf
      - build/${BOARD}/*.hex
      - build/${BOARD}/*.bin
      - build/${BOARD}/*.map
    expire_in: 1 month

# Tests of the image stamp tool (tools/vsl-stamp-image.py) and of
# cmake/VslStampImage.cmake.
test-tools:
  stage: test
  needs: []
  script:
    - cd "$CI_PROJECT_DIR"
    - export PATH="${GCC_TOOLCHAIN_PREFIX}/bin:$PATH"
    - python3 -m unittest discover -v -s tools/tests

# Compile check of the USB driver of the rewrite (src/usb). The old build
# does not compile it. It needs only the CMSIS headers of the STM32F1; the
# job gets them from ST, at the versions that system-stm32 uses. #7 adds
# the driver to the new build and removes this job.
compile-usb-driver:
  stage: build
  needs: []
  script:
    - cd "$CI_PROJECT_DIR"
    - git clone --quiet --depth 1 --branch v4.3.5 https://github.com/STMicroelectronics/cmsis_device_f1.git /tmp/cmsis_device_f1
    - git clone --quiet --depth 1 --branch v5.4.0_cm3 https://github.com/STMicroelectronics/cmsis_core.git /tmp/cmsis_core
    # system-stm32 gives cmsis_device.h; for the STM32F1 it includes stm32f1xx.h.
    - mkdir -p /tmp/cmsis_shim && printf '#include <stm32f1xx.h>\n' > /tmp/cmsis_shim/cmsis_device.h
    - >-
      ${GCC_TOOLCHAIN_PREFIX}/bin/arm-none-eabi-g++ -std=gnu++23 -mcpu=cortex-m3 -mthumb -Os
      -Wall -Wextra -Wconversion -Werror -fno-exceptions -fno-rtti -DSTM32F1 -DSTM32F103xB
      -I/tmp/cmsis_shim -I/tmp/cmsis_device_f1/Include -I/tmp/cmsis_core/Include
      -c src/usb/UsbCdc.cpp -o /tmp/UsbCdc.o
    - ${GCC_TOOLCHAIN_PREFIX}/bin/arm-none-eabi-size /tmp/UsbCdc.o
